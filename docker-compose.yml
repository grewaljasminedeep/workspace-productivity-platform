version: "3.9"

services:
  mongo:
    image: mongo:7
    container_name: workspace_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: adminpass
      MONGO_INITDB_DATABASE: workspace_db
    volumes:
      - mongo_data:/data/db

  backend:
    build: 
      context: ./backend
    container_name: workspace_backend